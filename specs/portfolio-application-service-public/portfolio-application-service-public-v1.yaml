        in: query
        description: 'Choice of One or multiple: NetROI, GrossROI, NetIRR'
        schema:
          $ref: '#/components/schemas/CalculationMethod'
      - name: cumulativePeriods
        in: query
        description: "List of cumulative period to get the performance.\r\nThe period\
