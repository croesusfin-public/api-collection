      - name: fixedPeriods
        in: query
        description: "List of fixed periods to get the performance.\r\nThe period\
          \ represent year : 2010, 2009, 2008 etc...\r\nCan not be used with CumulativePeriods\r\
          \nDefault: YTD (Year To Date)"
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
