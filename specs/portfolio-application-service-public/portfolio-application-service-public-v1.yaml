  /pfm/api/v1/accounts/{accountId}/portfolio/assetAllocations/positions:
    get:
      tags:
      - AssetAllocationPosition
      summary: Get the breakdown of a selected portfolio in terms of asset allocations
        and show the list of positions held in each asset class (or sub asset class)
        and their basic information
      description: "`min ref 2025-08 (90.51)`\r\n            This method validates\
        \ the provided request and retrieves the asset allocation\r\n            positions\
        \ for the specified account using the portfolio service. If the request is\
        \ invalid, a Microsoft.AspNetCore.Mvc.BadRequestResult is returned."
      operationId: getAssetAllocationPositionsByAccount
      parameters:
      - name: accountId
        in: path
        description: The unique identifier of the account whose asset allocation positions
          are to be retrieved.
        required: true
        schema:
          type: integer
          format: int32
      - name: requestedCurrency
        in: query
        description: "The currency in which the asset allocation position should be\
          \ expressed.  This parameter is optional and can be\r\n            null,\
          \ in which case the default currency will be used."
        schema:
          type: string
      - name: assetAllocationId
        in: query
        description: "The unique identifier of the asset allocation to retrieve. \
          \ This parameter is optional and can be null,\r\n            in which case\
          \ all asset allocations may be retrieved."
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AssetAllocationPositionsResponseStandard'
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAllocationPositionsResponseStandard'
            text/json:
              schema:
                $ref: '#/components/schemas/AssetAllocationPositionsResponseStandard'
        '400':
