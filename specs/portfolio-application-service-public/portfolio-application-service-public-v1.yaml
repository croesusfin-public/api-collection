  /pfm/api/v1/relationships/{relationshipId}/transactions:
    get:
      tags:
      - Transactions
      summary: Get a list of transactions for a specific relationship id.
      description: '`min ref 2025-12 (90.51)`'
      operationId: getTransactionsByRelationshipId
      parameters:
      - name: relationshipId
        in: path
        description: The relationship id to retrieve the transactions
        required: true
        schema:
          type: integer
          format: int32
      - name: dateType
        in: query
        description: 'One of: Transaction, Settlement. Default : Transaction'
        schema:
          $ref: '#/components/schemas/TransactionDataType'
      - name: startDate
        in: query
        description: Start date of the DateType choosen (yyyy-MM-dd).
        schema:
          type: string
      - name: endDate
        in: query
        description: End date of the DateType choosen (yyyy-MM-dd).
        schema:
          type: string
      - name: symbols
        in: query
        description: A list of Symbol (Maximum 50)
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      - name: transactionCurrency
        in: query
        description: The currency in which the transaction was made
        schema:
          type: string
      - name: typeCodeIds
        in: query
        description: Type of transaction
        schema:
          type: string
          format: List of integers seperated by commas, e.g., '1,2,3'
      - name: transactionIds
        in: query
        description: A list of Transactions ids (Maximum 50)
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: sortingRules
        in: query
        description: "List of properties to sort. \\\r\nUse comma as delimiter and\
          \ a - sign for descending ( i.e. -TransactionDate ) \\\r\n*Available values*:\
          \ ClientLongName, TransactionDate, SettlementDate, AccountNumber, Symbol."
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      - name: after
        in: query
        description: "The item id of the first item to be returned in the page when\
          \ moving forward. \\\r\nGet this value from the field *Next* of your response"
        schema:
          type: integer
          format: int64
      - name: before
        in: query
        description: "The item id of the last item to be returned in the page when\
          \ moving backwards. \\\r\nGet this value from the field *Previous* of your\
          \ response"
        schema:
          type: integer
          format: int64
      - name: pageLimit
        in: query
        description: The maximun number of items a page should return
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionResponsePagingStandard'
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponsePagingStandard'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionResponsePagingStandard'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
