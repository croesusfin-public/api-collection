openapi: 3.0.1
info:
  title: API CrmApplicationService Public V2
  version: public-v2
servers:
- url: https://api.gateway.croesus.com
- url: https://api-nonprod.gateway.croesus.com
security:
- Bearer: []
paths:
  /crm/api/v2/Accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Get an account by it's id
      description: '`min ref 2024-10 (90.46)`'
      operationId: getAccountById
      parameters:
      - name: accountId
        in: path
        description: The account id to retrieve the account
        required: true
        schema:
          type: integer
          format: int32
      - name: requestedCurrency
        in: query
        description: The Currency requested for display
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccountStandard'
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStandard'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountStandard'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
  /crm/api/v2/Accounts:
    get:
      tags:
      - Accounts
      summary: Get a list of accounts based in the filters sent
      description: '`min ref 2024-10 (90.46)`'
      operationId: getAccounts
      parameters:
      - name: accountIds
        in: query
        description: A list of account ids (Maximum 50)
        schema:
          type: string
          format: List of integers seperated by commas, e.g., '1,2,3'
      - name: accountNumbers
        in: query
        description: A list of account numbers (Maximum 50)
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      - name: clientIds
        in: query
        description: A list of client ids (Maximum 50)
        schema:
          type: string
          format: List of integers seperated by commas, e.g., '1,2,3'
      - name: clientNumbers
        in: query
        description: A list of client numbers (Maximum 50)
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      - name: investmentAdvisorCodes
        in: query
        description: A list of advisors codes (Maximum 51)
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      - name: accountCurrency
        in: query
        description: The account currency (CAD or USD)
        schema:
          type: string
      - name: requestedCurrency
        in: query
        description: The Currency requested for display (CAD, USD etc)
        schema:
          type: string
      - name: shortName
        in: query
        description: The Short Name
        schema:
          type: string
      - name: totalValueGT
        in: query
        description: Minimum total value required
        schema:
          type: number
          format: double
      - name: totalValueLT
        in: query
        description: Maximum total value required
        schema:
          type: number
          format: double
      - name: typeDescription
        in: query
        description: The type of account (Cash, Life Annuity)
        schema:
          type: string
      - name: profile
        in: query
        description: Profile filter where the profile name is the parameter key e.g.
          Profile.BrokerAccountNumber=800006-GT
        schema:
          type: object
          additionalProperties:
            type: string
      - name: after
        in: query
        description: "The item id of the first item to be returned in the page when\
          \ moving forward. \\\r\nGet this value from the field *Next* of your response"
        schema:
          type: integer
          format: int64
      - name: before
        in: query
        description: "The item id of the last item to be returned in the page when\
          \ moving backwards. \\\r\nGet this value from the field *Previous* of your\
          \ response"
        schema:
          type: integer
          format: int64
      - name: pageLimit
        in: query
        description: The maximun number of items a page should return
        schema:
          type: integer
          format: int32
      - name: sortingRules
        in: query
        description: "List of properties to sort. \\\r\nUse comma as delimiter and\
          \ a - sign for descending ( i.e. -ShortName ) \\\r\n*Available values*:\
          \ ShortName, AccountId, AccountNumber, ClientId, ClientNumber, InvestmentAdvisorCode,\
          \ AccountCurrency"
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccountPagingStandard'
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPagingStandard'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountPagingStandard'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/json:
              schema:
                $ref: '#/components/schemas/Error'
