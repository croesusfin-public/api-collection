openapi: 3.0.1
info:
  title: API Public V2
  version: public-v2
servers:
- url: https://api.gateway.croesus.com
- url: https://api-nonprod.gateway.croesus.com
security:
- Bearer: []
paths:
  /mkt/api/v2/securities:
    get:
      tags:
      - Securities
      summary: Get the list of securities based on filtering criteria.
      description: '`min ref 2026-04 (90.52)`'
      operationId: getSecurities
      parameters:
      - name: securityNumbers
        in: query
        description: Gets or sets the array of security number
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      - name: securityIds
        in: query
        description: Gets or sets the array of security identifiers.
        schema:
          type: string
          format: List of integers seperated by commas, e.g., '1,2,3'
      - name: symbol
        in: query
        description: Gets or sets the symbol of the security.
        schema:
          type: string
      - name: description
        in: query
        description: Gets or sets the description of the security.
        schema:
          type: string
      - name: market
        in: query
        description: Gets or sets the market identifier associated with the current
          instance.
        schema:
          type: string
      - name: securityCurrency
        in: query
        description: Currency in which the security values should be returned
        schema:
          type: string
      - name: region
        in: query
        description: Gets or sets the region of the security.
        schema:
          type: string
      - name: assetCategoryDescription
        in: query
        description: Gets or sets the asset category description.
        schema:
          type: string
      - name: financialInstrument
        in: query
        description: Gets or sets the financial instrument associated with the transaction
          or operation. Available values are (Stock, MutualFund, Bond, Option, Basket,
          Index, Currency, Cash, Future, Other, ExchangeTradedFund, TrustUnit, AssetBackedSecurity)
        schema:
          type: string
      - name: includeIndexes
        in: query
        description: Indicates whether to include index securities in the results.
        schema:
          type: boolean
      - name: includeInactives
        in: query
        description: Indicates whether to include inactive securities in the results.
        schema:
          type: boolean
      - name: sortingRules
        in: query
        description: List of properties to sort.
        schema:
          type: string
          format: List of strings seperated by commas, e.g, 'string1,string2,string3'
      - name: after
        in: query
        description: "The item id of the first item to be returned in the page when\
          \ moving forward. \\\r\nGet this value from the field *Next* of your response"
        schema:
          type: integer
          format: int64
      - name: before
        in: query
        description: "The item id of the last item to be returned in the page when\
          \ moving backwards. \\\r\nGet this value from the field *Previous* of your\
          \ response"
        schema:
          type: integer
          format: int64
      - name: pageLimit
        in: query
        description: The maximun number of items a page should return
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritiesGetResponsePagingStandard'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /mkt/api/v2/securities/{securityId}:
    get:
      tags:
      - Securities
      summary: Get a security by its identifier.
      description: '`min ref 2026-04 (90.52)`'
      operationId: getSecurityById
      parameters:
      - name: securityId
        in: path
        description: A croesus id for the security
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGetResponseStandard'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          readOnly: true
        Response:
          type: object
          description: Aways null since its an error
          format: Any object
          nullable: true
          readOnly: true
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: A list of message that contains any errors or warning that
            should be addressed
          nullable: true
      description: Standard generic response for errors cases
    SecuritiesGetResponse:
      type: object
      properties:
        SecurityId:
          type: integer
          description: Gets or sets the unique identifier for the entity.
          format: int64
          nullable: true
        SecurityNumber:
          type: string
          description: Gets or sets the unique security number.
        Symbol:
          type: string
          description: Gets or sets the symbol of the security.
        Cusip:
          type: string
          description: Gets or sets the Normalized Id. Stands for Committee on Uniform
            Securities Identification Procedures
        Description:
          type: string
          description: Security description
        Market:
          type: string
          description: Gets or sets the exchange market code associated with the current
            instance.
        SecurityCurrency:
          type: string
          description: Gets or sets the currency in which the security is denominated.
        Region:
          type: string
          description: Gets or sets the region in which the security is issued.
        MarketPrice:
          type: number
          description: Gets or sets the security market price, according to pricing
            method
          format: double
        BidPrice:
          type: number
          description: Gets or sets the bid price of the security.
          format: double
        AskPrice:
          type: number
          description: Gets or sets the ask price of the security.
          format: double
        ClosePrice:
          type: number
          description: Gets or sets the close price of the security.
          format: double
        PriceCurrency:
          type: string
          description: Gets or sets the currency of the price values.
        AssetCategoryId:
          type: integer
          description: Gets or sets the security subcategory identifier.
          format: int64
        AssetCategoryDescription:
          type: string
          description: Gets or sets the security subcategory description.
        FinancialInstrumentCode:
          type: string
          description: Gets or sets the financial instrument code associated with
            the transaction or operation.
        FinancialInstrumentDescription:
          type: string
          description: Gets or sets the financial instrument description.
        MarketYield:
          type: number
          description: Market yield of the security
          format: double
          nullable: true
      description: Represents the response for retrieving a list of securities.
    SecuritiesGetResponsePaging:
      type: object
      properties:
        Items:
          type: array
          items:
            $ref: '#/components/schemas/SecuritiesGetResponse'
        PageLimit:
          type: integer
          format: int32
        Next:
          type: integer
          format: int64
        Previous:
          type: integer
          format: int64
        NumberOfItems:
          type: integer
          format: int32
          readOnly: true
    SecuritiesGetResponsePagingStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          readOnly: true
        Response:
          $ref: '#/components/schemas/SecuritiesGetResponsePaging'
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    SecurityDividend:
      type: object
      properties:
        Amount:
          type: number
          description: Gets or sets the amount of the dividend.
          format: double
        Currency:
          type: string
          description: Gets or sets the currency of the dividend.
        Frequency:
          type: number
          description: Gets or sets the frequency of the dividend payments.
          format: double
        PaymentDate:
          type: string
          description: Gets or sets the date of the payment.
          format: date-time
          nullable: true
      description: Represents dividend information for a security.
    SecurityGetResponse:
      type: object
      properties:
        SecurityId:
          type: integer
          description: Gets or sets the unique identifier for the entity.
          format: int64
          nullable: true
        SecurityNumber:
          type: string
          description: Gets or sets the unique security number.
        Symbol:
          type: string
          description: Gets or sets the symbol of the security.
        Cusip:
          type: string
          description: Gets or sets the Normalized Id. Stands for Committee on Uniform
            Securities Identification Procedures
        Description:
          type: string
          description: Security description
        Market:
          type: string
          description: Gets or sets the exchange market code associated with the current
            instance.
        SecurityCurrency:
          type: string
          description: Gets or sets the currency in which the security is denominated.
        Region:
          type: string
          description: Gets or sets the region in which the security is issued.
        MarketPrice:
          type: number
          description: Gets or sets the security market price, according to pricing
            method
          format: double
        BidPrice:
          type: number
          description: Gets or sets the bid price of the security.
          format: double
        AskPrice:
          type: number
          description: Gets or sets the ask price of the security.
          format: double
        ClosePrice:
          type: number
          description: Gets or sets the close price of the security.
          format: double
        PriceCurrency:
          type: string
          description: Gets or sets the currency of the price values.
        AssetCategoryId:
          type: integer
          description: Gets or sets the security subcategory identifier.
          format: int64
        AssetCategoryDescription:
          type: string
          description: Gets or sets the security subcategory description.
        FinancialInstrumentCode:
          type: string
          description: Gets or sets the financial instrument code associated with
            the transaction or operation.
        FinancialInstrumentDescription:
          type: string
          description: Gets or sets the financial instrument description.
        Dividend:
          $ref: '#/components/schemas/SecurityDividend'
        Interest:
          $ref: '#/components/schemas/SecurityInterest'
        MarketYield:
          type: number
          description: Market yield of the security
          format: double
          nullable: true
      description: Represents the response for retrieving a security.
    SecurityGetResponseStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          readOnly: true
        Response:
          $ref: '#/components/schemas/SecurityGetResponse'
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    SecurityInterest:
      type: object
      properties:
        Percentage:
          type: number
          description: Gets or sets the interest percentage rate.
          format: double
        Frequency:
          type: integer
          description: Gets or sets the frequency of interest payments.
          format: int32
        MaturityDate:
          type: string
          description: Gets or sets the maturity date of the security.
          format: date-time
          nullable: true
        AccruedAmount:
          type: number
          description: Gets or sets the total accrued amount.
          format: double
      description: "Represents a financial security interest, including its percentage\
        \ rate, payment frequency, maturity date,\r\nand accrued amount."
    StandardMessage:
      type: object
      properties:
        Type:
          $ref: '#/components/schemas/StandardMessageType'
        Code:
          type: integer
          description: Error code. Used for internal investigation.
          format: int64
          nullable: true
        Message:
          type: string
          description: The error message.
          nullable: true
        Source:
          type: string
          description: Where the error occur in our system. Used for internal investigation.
          nullable: true
      description: A list of message that contains any errors or warning that should
        be addressed
    StandardMessageType:
      enum:
      - Unknown
      - Information
      - Error
      - Warning
      type: string
      description: A list of possible values for the message type
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme. (JWT_GENERATED
        ONLY)
      scheme: bearer
      bearerFormat: JWT
x-headmatter:
  readable_by:
  - market-public
  - croesus-dev
