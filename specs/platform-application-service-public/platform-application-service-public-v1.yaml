            \ are possible\r\n(group-by-security and group-by-sleeve are not available\
            \ in simulation)."
          nullable: true
        AssetClassId:
          type: integer
          description: "When grouping by asset class, the specific asset class to\
            \ drill into. When null in\r\n`ByAssetClass` mode, one summary row per\
            \ asset-class group is exported."
          format: int32
          nullable: true
        SelectedIds:
          type: array
          items:
            $ref: '#/components/schemas/SimulatedPositionKey'
          description: "The selected positions to export, keyed by (AccountId, SecurityId).\
            \ When null or empty,\r\nall positions are exported. Asset-class summary\
            \ rows are not individually selectable."
          nullable: true
