          type: boolean
          description: "Carried for parity with the standard positions export. The\
            \ projected\r\nCroesus.PortfolioApplicationService.Core.Contracts.V1.Rules.SimulationPositionExportBusinessRulesModel.PortfolioState\
            \ already reflects fund allocation as displayed."
        Currency:
          type: string
