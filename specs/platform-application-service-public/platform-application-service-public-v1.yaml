openapi: 3.0.1
info:
  title: Platform Services - Public
  description: Service that allows clients to perform Platform Management
  version: '1'
servers:
- url: https://api.gateway.croesus.com
- url: https://api-nonprod.gateway.croesus.com
security:
- Bearer: []
paths:
  /plf/scim/v2/Users:
    get:
      tags:
      - Users
      summary: Retrieves a list of SCIM users with optional filtering, sorting, and
        pagination.
      operationId: Users_GetUsers
      parameters:
      - name: filter
        in: query
        description: SCIM filter expression (e.g., 'userName eq "john.doe"')
        schema:
          type: string
      - name: attributes
        in: query
        description: Comma-separated list of attributes to include in response
        schema:
          type: string
      - name: excludedAttributes
        in: query
        description: Comma-separated list of attributes to exclude from response
        schema:
          type: string
      - name: sortBy
        in: query
        description: Attribute name to sort by (e.g., 'userName', 'displayName')
        schema:
          type: string
      - name: sortOrder
        in: query
        description: 'Sort order: ''ascending'' or ''descending'''
        schema:
          type: string
      - name: startIndex
        in: query
        description: '1-based start index for pagination (default: 1)'
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        description: 'Number of resources to return per page (default: 20)'
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserScimListResponse'
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '500':
          description: Internal Server Error
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
    post:
      tags:
      - Users
      summary: Creates a new SCIM user resource.
      operationId: Users_CreateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimUser'
          text/json:
            schema:
              $ref: '#/components/schemas/ScimUser'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '201':
          description: Created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '409':
          description: Conflict
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '500':
          description: Internal Server Error
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
  /plf/scim/v2/Users/.search:
    post:
      tags:
      - Users
      summary: Searches for SCIM users using POST with search request body.
      operationId: Users_SearchUsers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimSearchRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ScimSearchRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ScimSearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserScimListResponse'
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '500':
          description: Internal Server Error
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
  /plf/scim/v2/Users/{id}:
    get:
      tags:
      - Users
      summary: Retrieves a specific SCIM user by their unique identifier.
      operationId: Users_GetUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '404':
          description: Not Found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '500':
          description: Internal Server Error
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
    put:
      tags:
      - Users
      summary: Updates an existing SCIM user by replacing all attributes.
      operationId: Users_UpdateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimUser'
          text/json:
            schema:
              $ref: '#/components/schemas/ScimUser'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '404':
          description: Not Found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '500':
          description: Internal Server Error
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
    patch:
      tags:
      - Users
      summary: Partially updates a SCIM user using JSON Patch operations.
      operationId: Users_PatchUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '404':
          description: Not Found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '500':
          description: Internal Server Error
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
components:
  schemas:
    AccessLevelResponse:
      required:
      - PartyLevel
      - PartyLevelId
      - PartyLevelName
      type: object
      properties:
        PartyLevelId:
          type: integer
          description: Valeur numérique de l'enum PartyLevel
          format: int32
        PartyLevel:
          type: string
          description: Nom de la valeur de l'enum PartyLevel
          nullable: true
        PartyLevelName:
          type: string
          description: Valeur localisée du PartyLevel
          nullable: true
      description: Reponse contenant les informations nécessaires pour afficher un
        niveau d'accès
    AccessLevelResponseListStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          nullable: true
          readOnly: true
        Response:
          type: array
          items:
            $ref: '#/components/schemas/AccessLevelResponse'
          description: The real response object/>
          nullable: true
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    AccountClass:
      enum:
      - Real
      - RealManual
      - External
      - Fictitious
      - Model
      - Sleeve
      - Basket
      - Closed
      type: string
    AccountsPadResponseSortingRuleModel:
      type: object
      properties:
        Property:
          type: string
          description: Field name that will be used to sort
          nullable: true
        Direction:
          type: string
          description: The direction that should be applied. 'Asc' or 'Desc'
          nullable: true
          example: Asc
    AdvancedConditionFieldCategory:
      type: object
      properties:
        BasicFields:
          type: array
          items:
            $ref: '#/components/schemas/ConditionModuleAdvancedFieldValue'
          nullable: true
        AdvancedFields:
          type: array
          items:
            $ref: '#/components/schemas/ConditionModuleAdvancedFieldValue'
          nullable: true
    AdvancedConditionModule:
      type: object
      properties:
        ModuleDisplayName:
          type: string
          nullable: true
        FieldCategory:
          $ref: '#/components/schemas/FieldCategory'
        FieldCategoryDisplayName:
          type: string
          nullable: true
        Fields:
          $ref: '#/components/schemas/AdvancedConditionFieldCategory'
    AssetAllocationDefinitionResponse:
      type: object
      properties:
        RepartitionId:
          type: integer
          description: Unique identifier of the asset allocation (repartition) definition.
          format: int64
          nullable: true
        LocalizedName:
          type: string
          description: Localized display name of the definition (culture-specific).
          nullable: true
        IsVisible:
          type: boolean
          description: Indicates whether this definition is visible to consumers (UI
            / API clients).
          nullable: true
        IsReadonly:
          type: boolean
          description: Indicates whether this definition is read-only (cannot be modified).
          nullable: true
        PartyId:
          type: integer
          description: Identifier of the party (e.g., firm / entity) to which this
            definition belongs.
          format: int32
          nullable: true
        PartyDescription:
          type: string
          description: Human-readable description of the owning party.
          nullable: true
        OwnerId:
          type: integer
          description: Identifier of the owner (e.g., user / representative) who created
            or manages this definition.
          format: int32
          nullable: true
        Type:
          type: integer
          description: Type code of the asset allocation definition (application-specific
            classification).
          format: int32
          nullable: true
        SubClasses:
          type: array
          items:
            $ref: '#/components/schemas/AssetAllocationNodeResponse'
          description: Root level child nodes (asset class hierarchy) composing the
            allocation tree.
          nullable: true
      description: Represents an asset allocation (repartition) definition.
    AssetAllocationModel:
      type: object
      properties:
        AssetAllocationId:
          type: integer
          description: The asset allocation ID.
          format: int32
        AssetAllocationType:
          $ref: '#/components/schemas/AssetMixStructureType'
      description: The asset allocation of the portfolio.
    AssetAllocationNodeResponse:
      type: object
      properties:
        ClassId:
          type: integer
          description: Asset class identifier associated to this node.
          format: int64
          nullable: true
        ClassificationId:
          type: integer
          description: Identifier of the classification used for this node (repartition).
          format: int32
        RepNodeId:
          type: integer
          description: Parent repartition node identifier (null if root).
          format: int32
          nullable: true
        DisplayOrder:
          type: integer
          description: Order to display the node.
          format: int32
        LocalizedName:
          type: string
          description: Localized name / description of the node.
          nullable: true
        SubClasses:
          type: array
          items:
            $ref: '#/components/schemas/AssetAllocationNodeResponse'
          description: Child nodes (sub asset classes / sub nodes).
          nullable: true
      description: Represents a node inside an asset allocation (repartition) or objective
        tree.
    AssetAllocationsSplitResponse:
      type: object
      properties:
        Id:
          type: integer
          format: int64
          nullable: true
        AssetAllocations:
          type: array
          items:
            $ref: '#/components/schemas/AssetAllocationDefinitionResponse'
          description: List of asset allocations (repartitions) definitions.
          nullable: true
        InvestmentObjectives:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentObjectiveDefinitionResponse'
          description: List of investment objectives.
          nullable: true
      description: Response containing separated lists of asset allocations and investment
        objectives.
    AssetAllocationsSplitResponseStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          nullable: true
          readOnly: true
        Response:
          $ref: '#/components/schemas/AssetAllocationsSplitResponse'
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    AssetClassGroupModel:
      required:
      - ClassDescription
      - ColorCode
      type: object
      properties:
        AssetClassId:
          type: integer
          description: The id of the asset class.
          format: int32
        ClassDescription:
          type: string
          description: The Description of the Asset Class.
          nullable: true
        InvestedCapital:
          type: number
          description: The amount of capital invested in the asset class.
          format: double
        MarketValue:
          type: number
          description: The market value of the asset class.
          format: double
        MarketValuePercentage:
          type: number
          description: The percentage of the market value of the asset class.
          format: double
        InvestedCapitalGainLoss:
          type: number
          description: The capital gain or loss of the asset class.
          format: double
        AccruedInterestDividends:
          type: number
          description: The accrued interest dividends of the asset class.
          format: double
        AnnualIncome:
          type: number
          description: The annual income of the asset class.
          format: double
        BookValue:
          type: number
          description: The book value of the asset class.
          format: double
        BookValueGainLoss:
          type: number
          description: The capital gain or loss of the book value of the asset class.
          format: double
        ObjectiveMin:
          type: number
          description: The minimum objective of the asset class.
          format: double
          nullable: true
        ObjectiveMax:
          type: number
          description: The maximum objective of the asset class.
          format: double
          nullable: true
        ObjectiveTarget:
          type: number
          description: The target objective of the asset class.
          format: double
          nullable: true
        ObjectiveRating:
          $ref: '#/components/schemas/ObjectiveRating'
        ColorCode:
          type: string
          description: The color code of the asset class.
          nullable: true
        Positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionDataModel'
          description: The list of positions in the asset class.
          nullable: true
        PositionCount:
          type: integer
          description: The number of positions in the asset class.
          format: int32
          readOnly: true
      description: The data for the asset class section of a portfolio.
    AssetMixConditionFieldModel:
      type: object
      properties:
        DisplayName:
          type: string
          description: Represents the display name of the asset mix condition field
          nullable: true
        PropertyName:
          type: string
          description: Represents the property name of the asset mix condition field
          nullable: true
        ModuleName:
          type: string
          description: Represents the module name of the asset mix condition field
          nullable: true
        AvailableModules:
          type: array
          items:
            type: string
          description: Represent the module each field is available for (AssetMixVarationField
            and AsssetMixValueField)
          nullable: true
    AssetMixStructureType:
      enum:
      - Unknown
      - Classification
      - Repartition
      - InvestmentObjective
      - Sleeves
      type: string
    BoardType:
      enum:
      - Undefined
      - UpcomingOptionExpiration
      - UpcomingBondMaturity
      - Anniversary
      - RestrictedAccount
      - UpperCashBalance
      - LowerCashBalance
      - UnsynchronizedAccount
      - ExpiredOrder
      - GenericCriteriaBased
      - Schedule
      - GenericBrowser
      - Dashboard
      - CallList
      - CampaignManagement
      - UnsynchronizedModel
      - UnallocatedPositionSleeves
      - ApparentLossAlertBoard
      - SpecialDividends
      - DriftingSleeve
      type: string
    BranchPatchRequestJsonPatchDocument:
      title: BranchPatchRequest
      type: array
      items:
        $ref: '#/components/schemas/PatchRequestOperation'
      description: "Available operations.<ul>\r\n  <li>Name [ Replace ]</li>\r\n \
        \ <li>LocalizedNames [ Replace ]</li>\r\n  <li>Phone1 [ Replace ]</li>\r\n\
        \  <li>Phone2 [ Replace ]</li>\r\n  <li>Address [ Replace ]</li>\r\n  <li>Address2\
        \ [ Replace ]</li>\r\n  <li>City [ Replace ]</li>\r\n  <li>Province [ Replace\
        \ ]</li>\r\n  <li>Country [ Replace ]</li>\r\n  <li>ZipCode [ Replace ]</li>\r\
        \n  <li>RegionId [ Replace ]</li>\r\n</ul>"
    BranchResponse:
      required:
      - BranchId
      - Name
      - Number
      type: object
      properties:
        BranchId:
          type: integer
          description: Identifiant de la branche
          format: int32
        Number:
          type: string
          description: Numéro de la succursale
          nullable: true
        Province:
          type: string
          description: Provunce dans laquelle se situe la branche
          nullable: true
        City:
          type: string
          description: Ville dans laquelle se situe la branche
          nullable: true
        Name:
          type: string
          description: Nom de la branche
          nullable: true
        FirmId:
          type: integer
          description: Représente la firme à laquelle la branche est rattachée
          format: int64
        LocalizedNames:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedDescriptionResponse'
          description: Les noms localisés de la succursale.
          nullable: true
        Phone1:
          type: string
          description: Premier numéro de téléphone.
          nullable: true
        Phone2:
          type: string
          description: Deuxième numéro de téléphone.
          nullable: true
        Address:
          type: string
          description: Première ligne d'adresse.
          nullable: true
        Address2:
          type: string
          description: Deuxième ligne d'adresse.
          nullable: true
        ZipCode:
          type: string
          description: Code postal.
          nullable: true
        Country:
          type: string
          description: Pays.
          nullable: true
        RegionId:
          type: integer
          description: Région à laquelle la succursale appartient.
          format: int64
        IsFirmDefault:
          type: boolean
          description: Indique si la succursale est celle par défaut de la firme.
      description: Reponse contenant les informations nécessaires pour afficher une
        branche
    BranchResponseIEnumerableStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          nullable: true
          readOnly: true
        Response:
          type: array
          items:
            $ref: '#/components/schemas/BranchResponse'
          description: The real response object/>
          nullable: true
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    BranchResponseStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          nullable: true
          readOnly: true
        Response:
          $ref: '#/components/schemas/BranchResponse'
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    ClassPatchRequestJsonPatchDocument:
      title: ClassPatchRequest
      type: array
      items:
        $ref: '#/components/schemas/PatchRequestOperation'
      description: "Available operations.<ul>\r\n  <li>Id [  ]</li>\r\n  <li>LongNamesByCultureName\
        \ [ Replace ]</li>\r\n  <li>ShortNamesByCultureName [ Replace ]</li>\r\n \
        \ <li>Color [ Replace ]</li>\r\n  <li>ConditionContainer [ Replace ]</li>\r\
        \n</ul>"
    ClassResponse:
      type: object
      properties:
        Id:
          type: integer
          description: The unique identifier of the class
          format: int64
          nullable: true
        LocalizedName:
          type: string
          description: The localized long name of the class
          nullable: true
        LocalizedShortName:
          type: string
          description: The localized short name of the class
          nullable: true
        DisplayOrder:
          type: integer
          description: The display order of the class
          format: int32
        Other:
          type: boolean
          description: Indicates whether the class is other
        StartDate:
          type: string
          description: The start date of the class
          format: date-time
        EndDate:
          type: string
          description: The end date of the class
          format: date-time
          nullable: true
        Color:
          type: integer
          description: The color of the class
          format: int32
    ClassWithConditionResponse:
      type: object
      properties:
        Id:
          type: integer
          description: The unique identifier of the class
          format: int64
          nullable: true
        LocalizedName:
          type: string
          description: The localized long name of the class
          nullable: true
        LocalizedShortName:
          type: string
          description: The localized short name of the class
          nullable: true
        DisplayOrder:
          type: integer
          description: The display order of the class
          format: int32
        Other:
          type: boolean
          description: Indicates whether the class is other
        StartDate:
          type: string
          description: The start date of the class
          format: date-time
        EndDate:
          type: string
          description: The end date of the class
          format: date-time
          nullable: true
        Color:
          type: integer
          description: The color of the class
          format: int32
        ConditionContainer:
          $ref: '#/components/schemas/ComplexCondition'
    ClassWithConditionResponseStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          nullable: true
          readOnly: true
        Response:
          $ref: '#/components/schemas/ClassWithConditionResponse'
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    ClassificationResponse:
      type: object
      properties:
        Id:
          type: integer
          description: The unique identifier of the classification
          format: int64
          nullable: true
        LocalizedName:
          type: string
          description: The localized name of the classification
          nullable: true
        Type:
          type: integer
          description: The type of the classification
          format: int32
        PartyId:
          type: integer
          description: The party level of the classification
          format: int32
        PartyDescription:
          type: string
          description: The party description of the classification
          nullable: true
        OwnerId:
          type: integer
          description: The owner number of the classification
          format: int32
        IsReadOnly:
          type: boolean
          description: The read only status of the classification
        IsVisible:
          type: boolean
          description: The visibility of the classification
        Classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassResponse'
          nullable: true
      description: Classification response
    ClassificationResponseIEnumerableStandard:
      type: object
      properties:
        Time:
          type: string
          description: The UTC time at which the request was executed
          format: date-time
          readOnly: true
        CorrelationId:
          type: string
          description: A unique string that is used to trace the flow to executed
            request
          nullable: true
          readOnly: true
        Response:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationResponse'
          description: The real response object/>
          nullable: true
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/StandardMessage'
          description: Always null since its not an error
          nullable: true
      description: Standard generic response wrapper
    ClassificationType:
      enum:
      - AssetMix
      - Billing
      - IndustryCode
      - RiskIndex
      type: string
    ClientSleevesProcessDateInfo:
      type: object
      properties:
        Global:
          $ref: '#/components/schemas/ProcessDateInfo'
        Sleeves:
          $ref: '#/components/schemas/ProcessDateInfo'
        Positions:
          $ref: '#/components/schemas/ProcessDateInfo'
        Valid:
          type: boolean
          description: Whether the dates are valid.
